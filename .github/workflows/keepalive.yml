name: Keep Blitz App Awake

on:
  schedule:
    # 每 12 分钟执行一次健康检查，防止 Blitz 15 分钟无流量休眠
    # 注意：公开仓库 (Public Repository) 使用 GitHub Actions 完全免费，不消耗私有仓库机时配额
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Blitz Credential Manager Health Endpoint
        run: |
          echo "Pinging https://cred-manager.blitz48.blitz.cloud/api/health ..."
          curl -fsSL --retry 2 --max-time 30 \
            -H "User-Agent: GitHub-Actions-KeepAlive/1.0" \
            "https://cred-manager.blitz48.blitz.cloud/api/health"
          echo ""
